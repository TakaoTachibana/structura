version: '3.8'

services:
  stats-r:
    build:
      context: ./stats-r
      dockerfile: Dockerfile
    container_name: structura-stats-r
    ports:
      - "8000:8000"
    volumes:
      - ./stats-r:/app
    restart: unless-stopped

  solver-julia:
    build:
      context: ./solver-julia
      dockerfile: Dockerfile
    container_name: structura-solver-julia
    ports:
      - "8081:8081"
    volumes:
      - ./solver-julia:/app
    restart: unless-stopped

