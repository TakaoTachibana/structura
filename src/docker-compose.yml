version: '3.8'

services:
  stats-r:
    build:
      context: ./stats-r
      dockerfile: Dockerfile
    container_name: structura-stats-r
    ports:
      - "8082:8082"
    volumes:
      - ./stats-r:/app
    restart: unless-stopped

  solver-julia:
    build:
      context: ./solver-julia
      dockerfile: Dockerfile
    container_name: structura-solver-julia
    ports:
      - "8081:8081"
    volumes:
      - ./solver-julia:/app
    restart: unless-stopped
  
  gateway-go:
    build:
      context: ./gateway-go
      dockerfile: Dockerfile
    container_name: structura-gateway-go
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - R_SERVICE_URL=http://stats-r:8082
      - JULIA_SERVICE_URL=http://solver-julia:8081
    depends_on:
      - stats-r
      - solver-julia
    restart: unless-stoppedp

